project:
  name: md-harness
  specification_dir: .
  workspace_dir: .

git:
  repository_name: md-harness
  repository_url: https://github.com/ChristophHu/md-harness
  stable_branch: main
  workflow: gitflow
  auto_commit: true
  commit_message_prefix: "harness"
  auto_push: false
  policy:
    enforce_gitflow: true
    stable_branch: main
    development_branch: develop
    protected_branches:
      - main
      - develop
    required_checks:
      - ruff
      - mypy
      - sqlfluff
      - pytest
      - coverage

storage:
  database: state/harness.sqlite

knowledge:
  sources:
    - type: local_markdown
      name: obsidian-vault
      path: ~/md-harness-vault
      enabled: true
      read_only: true
  indexing:
    sqlite: true
    qdrant: false

secrets:
  provider: keychain_then_environment
  names:
    codex_api_key: CODEX_API_KEY
    qdrant_api_key: QDRANT_API_KEY
    kanban_api_token: KANBAN_API_TOKEN
    github_token: GITHUB_TOKEN

execution:
  dry_run: true
  max_retries: 2
  max_cycles: 3

quality:
  enabled: true
  linters:
    python: ruff
    sql: sqlfluff
  analyzers:
    typing: mypy

security:
  require_approval_for:
    - shell_command
    - file_delete
    - network_access
